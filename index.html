<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>SosoToolBox</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <button class="brand" data-view="home" aria-label="Accueil">
        <span class="brand-dot"></span>
        <span>SosoToolBox</span>
      </button>
      <div class="header-actions">
        <span class="version">V2</span>
        <button id="theme-toggle" class="theme-button" title="Changer le thème">◐</button>
      </div>
    </header>

    <section id="home-view" class="view active">
      <div class="intro">
        <span class="eyebrow">OUTILS UTILITAIRES</span>
        <h1>Tout ce dont tu as besoin.<br><em>Au même endroit.</em></h1>
        <p>Des petits outils rapides, propres et sans compte.</p>
      </div>

      <div class="tool-list">
        <button class="tool-row" data-tool="links">
          <span class="tool-number">01</span><span class="tool-icon">↗</span>
          <span class="tool-info"><strong>Nettoyeur de liens</strong><small>Nettoie une URL et retire le tracking inutile.</small></span>
          <span class="tool-arrow">↗</span>
        </button>
        <button class="tool-row" data-tool="images">
          <span class="tool-number">02</span><span class="tool-icon">▧</span>
          <span class="tool-info"><strong>Convertisseur d’images</strong><small>Convertis PNG, JPG et WebP directement.</small></span>
          <span class="tool-arrow">↗</span>
        </button>
        <button class="tool-row" data-tool="resize">
          <span class="tool-number">03</span><span class="tool-icon">↙</span>
          <span class="tool-info"><strong>Redimensionneur</strong><small>Change les dimensions d’une image en quelques secondes.</small></span>
          <span class="tool-arrow">↗</span>
        </button>
        <button class="tool-row" data-tool="palette">
          <span class="tool-number">04</span><span class="tool-icon">◉</span>
          <span class="tool-info"><strong>Palette de couleurs</strong><small>Crée une palette harmonieuse depuis une couleur.</small></span>
          <span class="tool-arrow">↗</span>
        </button>
        <button class="tool-row" data-tool="text">
          <span class="tool-number">05</span><span class="tool-icon">T</span>
          <span class="tool-info"><strong>Outils texte</strong><small>Transforme, nettoie, compte et copie ton texte.</small></span>
          <span class="tool-arrow">↗</span>
        </button>
        <button class="tool-row" data-tool="password">
          <span class="tool-number">06</span><span class="tool-icon">⌁</span>
          <span class="tool-info"><strong>Générateur de mots de passe</strong><small>Génère un mot de passe aléatoire localement.</small></span>
          <span class="tool-arrow">↗</span>
        </button>
      </div>

      <footer><span>6 outils</span><span>Traitement local · Aucun compte</span></footer>
    </section>

    <section id="tool-view" class="view">
      <button class="back-button" data-view="home">← Tous les outils</button>
      <div id="tool-content"></div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
